<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
    <defs>
        <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#0B1020"/>
            <stop offset="100%" stop-color="#111827"/>
        </linearGradient>
        <filter id="glow"><feGaussianBlur stdDeviation="3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
        <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#38BDF8"/></marker>
    </defs>
    <rect width="100%" height="100%" fill="url(#bg)"/>
    <text x="640" y="55" fill="#F9FAFB" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="600" text-anchor="middle">Velocity profile: скорость между gaze-точками</text><line x1="160" y1="590" x2="1120" y2="590" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrow)"/><line x1="160" y1="590" x2="160" y2="120" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrow)"/><text x="1100" y="630" fill="#CBD5E1" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="600" text-anchor="middle">time</text><text x="105" y="135" fill="#CBD5E1" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="600" text-anchor="middle">velocity</text><polyline points="180.0,567.0 255.0,544.0 330.0,406.0 405.0,199.0 480.0,383.0 555.0,475.0 630.0,314.0 705.0,452.0 780.0,532.5 855.0,245.0 930.0,406.0 1005.0,509.5 1080.0,544.0" fill="none" stroke="#38BDF8" stroke-width="5"/><circle cx="180.0" cy="567.0" r="6" fill="#22D3EE"/><circle cx="255.0" cy="544.0" r="6" fill="#22D3EE"/><circle cx="330.0" cy="406.0" r="6" fill="#22D3EE"/><circle cx="405.0" cy="199.0" r="6" fill="#22D3EE"/><circle cx="480.0" cy="383.0" r="6" fill="#22D3EE"/><circle cx="555.0" cy="475.0" r="6" fill="#22D3EE"/><circle cx="630.0" cy="314.0" r="6" fill="#22D3EE"/><circle cx="705.0" cy="452.0" r="6" fill="#22D3EE"/><circle cx="780.0" cy="532.5" r="6" fill="#22D3EE"/><circle cx="855.0" cy="245.0" r="6" fill="#22D3EE"/><circle cx="930.0" cy="406.0" r="6" fill="#22D3EE"/><circle cx="1005.0" cy="509.5" r="6" fill="#22D3EE"/><circle cx="1080.0" cy="544.0" r="6" fill="#22D3EE"/><line x1="160" y1="430" x2="1120" y2="430" stroke="#FDE047" stroke-width="2" stroke-dasharray="10 8"/><text x="1020" y="420" fill="#FDE68A" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="600" text-anchor="middle">mean_velocity</text><circle cx="405.0" cy="199.0" r="15" fill="none" stroke="#F472B6" stroke-width="3"/><text x="405.0" y="171.0" fill="#FBCFE8" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600" text-anchor="middle">peak</text><circle cx="630.0" cy="314.0" r="15" fill="none" stroke="#F472B6" stroke-width="3"/><text x="630.0" y="286.0" fill="#FBCFE8" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600" text-anchor="middle">peak</text><circle cx="855.0" cy="245.0" r="15" fill="none" stroke="#F472B6" stroke-width="3"/><text x="855.0" y="217.0" fill="#FBCFE8" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600" text-anchor="middle">peak</text><text x="640" y="680" fill="#FDE68A" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="600" text-anchor="middle">v = distance / Δt</text>
</svg>
